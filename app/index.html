<!doctype html>
<html lang="en" class="dark" style="background: #090b0c">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#090b0c" />
    <!-- An installed iPhone app draws under the clock and the Dynamic Island, so the hub's
         curtain reaches the top of the screen and every other screen paints that band itself
         (DESIGN.md "The status bar"). iOS reads this when the app is added to the Home Screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark light" />
    <title>Carnatic Wrapped</title>
    <!-- The mark (DESIGN.md "The mark"). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#da3f58" />
    <script>
      // Before anything draws: the rasika's theme, so the launch never flashes the wrong one
      // (DESIGN.md "No white flash"; app/src/theme.ts keeps the same key).
      try {
        if (localStorage.getItem('wrapped.theme') === 'light') {
          var root = document.documentElement;
          root.classList.remove('dark');
          root.style.background = '#ffffff';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
        }
      } catch (error) {}
      // Before anything draws: an installed iPhone app, which iOS sizes a status bar short
      // (app/src/styles/base.css `--app-height`; DESIGN.md "The status bar").
      try {
        if (navigator.standalone === true) {
          document.documentElement.setAttribute('data-ios-app', '');
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
