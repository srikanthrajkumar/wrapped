<!doctype html>
<html lang="en" class="dark" style="background: #090b0c">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#090b0c" />
    <!-- An installed iPhone app draws under the clock and the Dynamic Island, so the hub's
         curtain reaches the top of the screen and every other screen paints that band itself
         (DESIGN.md "The status bar"). iOS reads this when the app is added to the Home Screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-title" content="carnatic.live" />
    <title>carnatic.live: your December season concert diary</title>
    <!-- What search engines and link previews show (WhatsApp first). The public name is
         carnatic.live; og.png is drawn by tools/og-image/build.mjs. -->
    <meta
      name="description"
      content="Log the concerts you hear in the Chennai December season, with their ragas and songs, even offline."
    />
    <link rel="canonical" href="https://carnatic.live/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="carnatic.live" />
    <meta property="og:url" content="https://carnatic.live/" />
    <meta property="og:title" content="carnatic.live: your December season concert diary" />
    <meta
      property="og:description"
      content="Log the concerts you hear in the Chennai December season, with their ragas and songs, even offline."
    />
    <meta property="og:image" content="https://carnatic.live/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="carnatic.live, with its kolam and a field of rose silk: your December season concert diary"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "carnatic.live",
        "url": "https://carnatic.live/",
        "description": "Log the concerts you hear in the Chennai December season, with their ragas and songs, even offline.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
      }
    </script>
    <!-- The mark (DESIGN.md "The mark"). -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#da3f58" />
    <script>
      // Before anything draws: the rasika's theme, so the launch never flashes the wrong one
      // (DESIGN.md "No white flash"; app/src/theme.ts keeps the same key).
      try {
        if (localStorage.getItem('wrapped.theme') === 'light') {
          var root = document.documentElement;
          root.classList.remove('dark');
          root.style.background = '#ffffff';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
        }
      } catch (error) {}
      // Before anything draws: an installed iPhone app, which iOS sizes a status bar short
      // (app/src/styles/base.css `--app-height`; DESIGN.md "The status bar").
      try {
        if (navigator.standalone === true) {
          document.documentElement.setAttribute('data-ios-app', '');
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- For crawlers that read the page without running it. A <noscript> never draws while
           scripts run, so the launch never flashes it; React replaces #root when it mounts. -->
      <noscript>
        <h1>carnatic.live</h1>
        <p>
          Log the concerts you hear in the Chennai December season: the artists, the ragas and the
          songs, even offline at the sabha. Then get your Margazhi recapped.
        </p>
        <p>carnatic.live needs JavaScript to run.</p>
        <p><a href="/privacy">Privacy policy</a></p>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
