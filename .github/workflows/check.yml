# Runs the same checks a commit must pass locally (CONTRIBUTING.md), plus a scan of every file
# the new commits add, so a secret or catalog snapshot added and then deleted still fails.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, so the scan below can see every commit in the range.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: No forbidden file added in these commits
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node tools/repo-guard/added-files.mjs "$BASE_SHA" "$HEAD_SHA"

      - run: npm ci

      # The two Supabase stacks for the server tests start in the background, one after the
      # other, while the browser installs and `npm run check` runs: nothing before
      # test:server uses them, and starting them took about 100 s of the job. A process left
      # running in a step lives on until the job ends. Each start writes its exit code to a
      # file that the wait step below reads.
      #
      # The local Supabase stack (T067, T068), from the CLI pinned in package-lock.json: only
      # the database, Auth, the API and its gateway. Google sign-in has no credentials here
      # and is not used by the tests. Then the public-data stack beside it (ADR 0009), on ports
      # of its own, for the Schedule's bucket and function: the database, Auth, Storage, the
      # Edge runtime and the gateway.
      - name: Start the Supabase stacks in the background
        run: |
          nohup bash -c '
            npx supabase start -x studio,mailpit,postgres-meta,imgproxy,logflare,vector,supavisor,realtime,storage-api,edge-runtime \
              > "$RUNNER_TEMP/stack-personal.log" 2>&1
            echo $? > "$RUNNER_TEMP/stack-personal.rc"
            npx supabase start --workdir supabase-public -x studio,mailpit,postgres-meta,imgproxy,logflare,vector,supavisor,realtime \
              > "$RUNNER_TEMP/stack-public.log" 2>&1
            echo $? > "$RUNNER_TEMP/stack-public.rc"
          ' > /dev/null 2>&1 &

      # The browser matching the locked @playwright/test, with its system libraries.
      - run: npx playwright install --with-deps chromium

      - run: npm run check

      # Both stacks up, or their logs and a failure. Ten minutes covers a slow image pull.
      - name: Wait for the Supabase stacks
        run: |
          for _ in $(seq 600); do
            [ -f "$RUNNER_TEMP/stack-public.rc" ] && break
            sleep 1
          done
          status=0
          for stack in personal public; do
            echo "::group::$stack stack"
            cat "$RUNNER_TEMP/stack-$stack.log" 2>/dev/null || echo "no log"
            echo "::endgroup::"
            rc=$(cat "$RUNNER_TEMP/stack-$stack.rc" 2>/dev/null || echo "not finished")
            if [ "$rc" != 0 ]; then
              echo "::error::The $stack Supabase stack did not start ($rc)."
              status=1
            fi
          done
          exit $status

      # The required sync and privacy tests gate every merge (constitution IV).
      - run: npm run test:server

      # The failed end-to-end tests' traces, kept for a week. The repository is public, so anyone
      # can download them: test-results/ holds only the traces and the browser profiles of tests
      # run on the handmade test data.
      - name: Keep Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: app/test-results/
          retention-days: 7
          if-no-files-found: ignore
